<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===================== DEPOSIT (L1 -> L2) ===================== -->
  <rect x="24" y="24" width="352" height="452" rx="12" fill="#f5f7fa" stroke="#cbd5e1"/>
  <text x="52" y="58" font-size="16" font-weight="700" fill="#166534">Deposit</text>
  <text x="132" y="58" font-size="13" fill="#64748b">L1 → L2</text>
  <rect x="256" y="42" width="96" height="24" rx="12" fill="#e9f7ef" stroke="#16a34a"/>
  <text x="304" y="58" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">fast · minutes</text>

  <rect x="48" y="88" width="304" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="112" font-size="13" font-weight="600" fill="#1f2937">1 · Lock / escrow tokens on L1</text>
  <text x="66" y="130" font-size="11.5" fill="#64748b">L1 gateway holds them, sends a message via the Inbox</text>

  <line x1="200" y1="146" x2="200" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="48" y="176" width="304" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="200" font-size="13" font-weight="600" fill="#1f2937">2 · Retryable ticket → L2</text>
  <text x="66" y="218" font-size="11.5" fill="#64748b">guarantees eventual execution on L2</text>

  <line x1="200" y1="234" x2="200" y2="264" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="48" y="264" width="304" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="288" font-size="13" font-weight="600" fill="#1f2937">3 · Mint bridged tokens on L2</text>
  <text x="66" y="306" font-size="11.5" fill="#64748b">you can use them right away</text>

  <text x="200" y="400" text-anchor="middle" font-size="12" fill="#64748b">Going down is fast — no waiting.</text>

  <!-- ===================== WITHDRAW (L2 -> L1) ===================== -->
  <rect x="424" y="24" width="352" height="452" rx="12" fill="#f5f7fa" stroke="#cbd5e1"/>
  <text x="452" y="58" font-size="16" font-weight="700" fill="#9a3412">Withdraw</text>
  <text x="548" y="58" font-size="13" fill="#64748b">L2 → L1</text>
  <rect x="640" y="42" width="112" height="24" rx="12" fill="#fdf2e3" stroke="#d97706"/>
  <text x="696" y="58" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9a3412">slow · ~7 days</text>

  <rect x="448" y="80" width="304" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="466" y="102" font-size="13" font-weight="600" fill="#1f2937">1 · Burn bridged tokens on L2</text>
  <text x="466" y="120" font-size="11.5" fill="#64748b">via ArbSys.sendTxToL1</text>

  <line x1="600" y1="132" x2="600" y2="158" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="448" y="158" width="304" height="52" rx="8" fill="#fdf2e3" stroke="#d97706"/>
  <text x="466" y="180" font-size="13" font-weight="700" fill="#9a3412">2 · ⏳ Challenge period (~7 days)</text>
  <text x="466" y="198" font-size="11.5" fill="#9a3412">wait for the assertion to be confirmed</text>

  <line x1="600" y1="210" x2="600" y2="236" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="448" y="236" width="304" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="466" y="258" font-size="13" font-weight="600" fill="#1f2937">3 · Prove + Outbox.executeTransaction</text>
  <text x="466" y="276" font-size="11.5" fill="#64748b">construct the proof, execute on L1</text>

  <line x1="600" y1="288" x2="600" y2="314" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="448" y="314" width="304" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="466" y="336" font-size="13" font-weight="600" fill="#1f2937">4 · Release escrowed tokens on L1</text>
  <text x="466" y="354" font-size="11.5" fill="#64748b">the L1 gateway hands them back</text>

  <text x="600" y="410" text-anchor="middle" font-size="12" fill="#64748b">The delay is why "fast bridges" exist.</text>
</svg>
