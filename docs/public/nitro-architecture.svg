<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Stage 1: Users / dApps -->
  <rect x="280" y="20" width="200" height="50" rx="10" fill="#f5f7fa" stroke="#cbd5e1"/>
  <text x="380" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Users / dApps</text>

  <!-- arrow 1 -->
  <line x1="380" y1="70" x2="380" y2="102" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="392" y="90" font-size="12" fill="#64748b">transactions</text>

  <!-- Stage 2: Sequencer -->
  <rect x="190" y="102" width="380" height="62" rx="10" fill="#e8f1fc" stroke="#1e6fd9"/>
  <text x="380" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#0b3d78">Sequencer</text>
  <text x="380" y="148" text-anchor="middle" font-size="12.5" fill="#334155">orders txs · gives instant "soft" confirmation</text>

  <!-- arrow 2 -->
  <line x1="380" y1="164" x2="380" y2="196" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 3: Nitro node (Geth sandwich) -->
  <rect x="150" y="196" width="460" height="214" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="380" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Nitro node — the "Geth sandwich"</text>

  <rect x="176" y="236" width="408" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="196" y="258" font-size="13.5" font-weight="600" fill="#1f2937">Node Interface</text>
  <text x="196" y="275" font-size="12" fill="#64748b">RPC surface for wallets &amp; dapps</text>

  <rect x="176" y="292" width="408" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="196" y="314" font-size="13.5" font-weight="600" fill="#1f2937">ArbOS</text>
  <text x="196" y="331" font-size="12" fill="#64748b">L2 OS: gas accounting · cross-chain messaging · upgrades</text>

  <rect x="176" y="348" width="408" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="196" y="370" font-size="13.5" font-weight="600" fill="#1f2937">Geth (forked)</text>
  <text x="196" y="387" font-size="12" fill="#64748b">runs the EVM → fully EVM-equivalent</text>

  <!-- arrow 3 -->
  <line x1="380" y1="410" x2="380" y2="444" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="392" y="432" font-size="12" fill="#64748b">batch · Brotli-compressed → blobs</text>

  <!-- Stage 4: Ethereum L1 -->
  <rect x="190" y="444" width="380" height="66" rx="10" fill="#e8f1fc" stroke="#1e6fd9"/>
  <text x="380" y="472" text-anchor="middle" font-size="15" font-weight="700" fill="#0b3d78">Ethereum L1</text>
  <text x="380" y="492" text-anchor="middle" font-size="12.5" fill="#334155">tx data posted here → "hard" finality (~10–20 min)</text>
</svg>
